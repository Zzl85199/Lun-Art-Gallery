<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>故事本列印預覽 - AI 創作畫廊</title>
<link href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  body { background: #fff; }
  .print-toolbar { position: sticky; top: 0; background: #fff; padding: 12px 20px; border-bottom: 1px solid #ddd; display: flex; gap: 10px; align-items: center; z-index: 10; }
  .print-page { max-width: 800px; margin: 30px auto; padding: 30px; page-break-after: always; }
  .print-page:last-child { page-break-after: auto; }
  .print-page img { max-width: 100%; border-radius: 10px; display: block; margin: 0 auto 16px; }
  .print-page .caption { font-family: var(--font-hand); font-size: 1.15rem; line-height: 1.8; text-align: center; white-space: pre-wrap; }
  .print-title { text-align: center; font-family: var(--font-hand); font-size: 2rem; margin: 40px 0; }
  @media print {
    .print-toolbar { display: none; }
    .print-page { margin: 0; max-width: 100%; }
  }
</style>
</head>
<body>
  <div class="print-toolbar">
    <button class="btn btn-pin" onclick="window.print()">🖨️ 列印 / 另存 PDF</button>
    <span id="print-status" style="color:#6b5f4c;"></span>
  </div>
  <div id="print-content"></div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/print.js"></script>
</body>
</html>
